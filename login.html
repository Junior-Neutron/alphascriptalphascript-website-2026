<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlphaScript | Login & Signup</title>
<meta name="theme-color" content="#030605">

<style>
:root {
    --bg: #030605;
    --panel: #07110B;
    --green: #00FF77;
    --text: #F1FFF5;
    --muted: #8BA997;
    --border: #173A27;
    --error: #FF7373;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(#00FF7708 1px, transparent 1px),
        linear-gradient(90deg, #00FF7708 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 410px;
    padding: 30px 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 0 35px #00FF770A;
}

.logo {
    margin-bottom: 12px;
    text-align: center;
    color: var(--green);
    font-size: 42px;
    font-weight: 900;
    text-shadow: 0 0 15px #00FF7740;
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 10px;
}

.subtitle {
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.tab {
    flex: 1;
    padding: 12px;
    color: var(--muted);
    background: #030605;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    color: var(--green);
    border-color: var(--green);
    background: #00FF770D;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: var(--muted);
    font-size: 13px;
}

input {
    display: block;
    width: 100%;
    padding: 13px;
    background: #030605;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    color: var(--text);
    font-size: 15px;
}

input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px #00FF7715;
}

.submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: var(--green);
    color: #001A0B;
    border: none;
    border-radius: 8px;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
}

.submit:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    overflow-wrap: anywhere;
}

.message.error {
    color: var(--error);
}

.message.success {
    color: var(--green);
}

.back {
    display: block;
    margin-top: 22px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    text-align: center;
}

.back:hover {
    color: var(--green);
}

@media (max-width: 400px) {
    .card {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<div class="grid" aria-hidden="true"></div>

<main class="card">

    <div class="logo">A</div>

    <h1 id="heading">Create your account</h1>

    <p class="subtitle">
        Your code. Your community. Your evolution.
    </p>

    <div class="tabs">
        <button
            type="button"
            class="tab"
            id="loginTab">
            Log In
        </button>

        <button
            type="button"
            class="tab active"
            id="signupTab">
            Sign Up
        </button>
    </div>

    <form id="authForm">

        <label for="email">Email address</label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required>

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="At least 6 characters"
            required>

        <button
            class="submit"
            id="submitButton"
            type="submit">
            Create Account
        </button>

    </form>

    <p
        class="message"
        id="message"
        role="status"
        aria-live="polite">
    </p>

    <a class="back" href="motion.html">
        Back to AlphaScript intro
    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
    "use strict";

    /*
      IMPORTANT:
      Replace both placeholders below with the values
      from your own Supabase project.

      Never use a service_role or secret key here.
    */

    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_TjT6PMScm58zNVJiugk-zQ_6oIaJNU9";

    const heading = document.getElementById("heading");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let mode = "signup";

    const params = new URLSearchParams(window.location.search);

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + (type || "");
    }

    function setMode(nextMode) {
        mode = nextMode;

        const isSignup = mode === "signup";

        heading.textContent = isSignup
            ? "Create your account"
            : "Welcome back";

        submitButton.textContent = isSignup
            ? "Create Account"
            : "Log In";

        passwordInput.autocomplete = isSignup
            ? "new-password"
            : "current-password";

        loginTab.classList.toggle("active", !isSignup);
        signupTab.classList.toggle("active", isSignup);

        showMessage("", "");

        const url = new URL(window.location.href);
        url.searchParams.set("screen", mode);

        window.history.replaceState({}, "", url);
    }

    loginTab.addEventListener("click", function () {
        setMode("login");
    });

    signupTab.addEventListener("click", function () {
        setMode("signup");
    });

    setMode(params.get("screen") === "login" ? "login" : "signup");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (
            SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
            SUPABASE_PUBLIC_KEY ===
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhaXZxc2Nzc2R0c250aGRpcXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mjg3MjgsImV4cCI6MjEwNzMwNDcyOH0.i3cpwFKOCnfvGtAKsRpP3LxwIQl2l3-ZJq_9WTrRBP8"
        ) {
            showMessage(
                "Supabase is not configured yet. Add your project URL and public key to connect authentication.",
                "error"
            );
            return;
        }

        if (!window.supabase) {
            showMessage(
                "The authentication library could not load. Check your internet connection and try again.",
                "error"
            );
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Please wait...";
        showMessage("", "");

        try {
            const client = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLIC_KEY
            );

            let result;

            if (mode === "signup") {
                result = await client.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo:
                            new URL("profile.html", window.location.href).href
                    }
                });

                if (result.error) {
                    throw result.error;
                }

                if (result.data.session) {
                    showMessage(
                        "Account created successfully. Opening your profile...",
                        "success"
                    );

                    window.location.assign(
                        new URL("profile.html", window.location.href).href
                    );

                    return;
                }

                showMessage(
                    "Signup request completed. If email confirmation is enabled, check your inbox to confirm your account.",
                    "success"
                );

            } else {
                result = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (result.error) {
                    throw result.error;
                }

                showMessage(
                    "Login successful. Opening your profile...",
                    "success"
                );

                window.location.assign(
                    new URL("profile.html", window.location.href).href
                );

                return;
            }

        } catch (error) {
            showMessage(
                error.message || "Authentication failed. Please try again.",
                "error"
            );

        } finally {
            submitButton.disabled = false;

            submitButton.textContent = mode === "signup"
                ? "Create Account"
                : "Log In";
        }
    });

})();
</script>

</body>
</html>
