<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaScript | Code Beyond Limits</title>
<meta name="theme-color" content="#030605">

<style>
:root {
    --bg: #030605;
    --panel: #07110B;
    --green: #00FF77;
    --text: #F1FFF5;
    --muted: #8BA997;
    --border: #173A27;
    --error: #FF7373;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
        linear-gradient(#00FF7710 1px, transparent 1px),
        linear-gradient(90deg, #00FF7710 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 12s linear infinite;
}

@keyframes gridMove {
    to { background-position: 40px 40px; }
}

/* MOTION INTRO */

.intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: var(--bg);
    transition: opacity .6s ease, visibility .6s ease;
}

.intro.leaving {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.logo-container {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: var(--green);
    border-bottom-color: var(--green);
    border-radius: 50%;
    filter: drop-shadow(0 0 8px var(--green));
    animation: rotate 4s linear infinite;
}

.ring.two {
    inset: 13px;
    border-top-color: transparent;
    border-left-color: var(--green);
    border-right-color: var(--green);
    animation: rotateBack 3s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes rotateBack {
    to { transform: rotate(-360deg); }
}

.intro-logo {
    position: relative;
    z-index: 2;
    font-size: 100px;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 12px #00FF77, 0 0 30px #00FF7780;
    animation: logoAppear 1.2s ease both;
}

@keyframes logoAppear {
    from { transform: scale(.5); opacity: .3; }
    to { transform: scale(1); opacity: 1; }
}

.brand {
    font-size: clamp(27px, 7vw, 43px);
    font-weight: 900;
    letter-spacing: 5px;
}

.brand span { color: var(--green); }

.tagline {
    margin-top: 14px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    line-height: 1.8;
}

.loading-area {
    width: 220px;
    margin-top: 40px;
}

.loading-text {
    margin-bottom: 12px;
    color: var(--green);
    font-size: 10px;
    letter-spacing: 3px;
}

.loading-track {
    width: 100%;
    height: 3px;
    background: #123321;
}

.loading-bar {
    width: 0;
    height: 3px;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: load 5s linear forwards;
}

@keyframes load {
    to { width: 100%; }
}

/* AUTHENTICATION */

.auth-screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 24px;
    display: none;
    align-items: center;
    justify-content: center;
}

.auth-screen.visible {
    display: flex;
    animation: authAppear .6s ease both;
}

@keyframes authAppear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.card {
    width: 100%;
    max-width: 410px;
    padding: 30px 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 0 35px #00FF770A;
}

.auth-logo {
    text-align: center;
    color: var(--green);
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 12px;
}

.card h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 10px;
}

.subtitle {
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.tab {
    flex: 1;
    padding: 12px;
    color: var(--muted);
    background: #030605;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    color: var(--green);
    border-color: var(--green);
    background: #00FF770D;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: var(--muted);
    font-size: 13px;
}

input {
    display: block;
    width: 100%;
    padding: 13px;
    background: #030605;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    color: var(--text);
    font-size: 15px;
}

input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px #00FF7715;
}

.password-rules {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
}

.password-rules p.valid {
    color: var(--green);
}

.password-rules p.invalid {
    color: var(--error);
}

.submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: var(--green);
    color: #001A0B;
    border: none;
    border-radius: 8px;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
}

.submit:disabled {
    opacity: .6;
    cursor: wait;
}

.message {
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    overflow-wrap: anywhere;
}

.message.error { color: var(--error); }
.message.success { color: var(--green); }

.back {
    display: block;
    margin-top: 22px;
    color: var(--muted);
    background: none;
    border: none;
    width: 100%;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
}

.back:hover { color: var(--green); }

@media (max-width: 400px) {
    .logo-container { width: 145px; height: 145px; }
    .intro-logo { font-size: 85px; }
    .tagline { font-size: 9px; letter-spacing: 1.5px; }
    .card { padding: 25px 18px; }
}

@media (prefers-reduced-motion: reduce) {
    .grid, .ring, .intro-logo, .loading-bar, .auth-screen {
        animation-duration: .01ms;
        animation-iteration-count: 1;
    }
}
</style>
</head>

<body>

<div class="grid" aria-hidden="true"></div>

<!-- MOTION INTRO -->

<main class="intro" id="intro">
    <div class="logo-container">
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="intro-logo" aria-label="AlphaScript logo">A</div>
    </div>
