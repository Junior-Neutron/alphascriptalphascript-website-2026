<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Reset your AlphaScript account password.">

  <title>Reset Password | AlphaScript</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070b14;
      --card: #101827;
      --input: #0b1220;
      --text: #f3f6ff;
      --muted: #9aa8bd;
      --border: #26344a;
      --accent: #6d7cff;
      --accent-hover: #5365f5;
      --success: #35d39a;
      --error: #ff6b7a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f2f5fb;
      --card: #ffffff;
      --input: #f7f9fd;
      --text: #172033;
      --muted: #637087;
      --border: #dce3ef;
      --accent: #5265f5;
      --accent-hover: #3d50e5;
      --success: #087f5b;
      --error: #d92d45;
      --shadow: 0 24px 70px rgba(25, 40, 70, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      margin-bottom: 24px;
      text-align: center;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6d7cff, #a855f7);
      color: white;
      font-size: 25px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -0.8px;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 48px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(109, 124, 255, 0.15);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      transition: background 0.2s, opacity 0.2s;
    }

    .button:hover {
      background: var(--accent-hover);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .message {
      display: none;
      margin: 0 0 18px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.visible {
      display: block;
    }

    .message.success {
      border-color: var(--success);
      color: var(--success);
    }

    .message.error {
      border-color: var(--error);
      color: var(--error);
    }

    .message.info {
      color: var(--muted);
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    a:hover {
      text-decoration: underline;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-button {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 23px 19px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top-actions">
      <button class="theme-button" id="themeButton" type="button">
        Toggle theme
      </button>
    </div>

    <header class="brand">
      <div class="brand-icon">A</div>
      <h1>AlphaScript</h1>
      <p>Your coding journey starts here.</p>
    </header>

    <section class="card">
      <h2>Reset your password</h2>

      <p class="description" id="pageDescription">
        Choose a new password for your AlphaScript account.
      </p>

      <div
        class="message info visible"
        id="statusMessage"
        role="status"
        aria-live="polite"
      >
        Checking your password-reset link...
      </div>

      <form id="resetForm" class="hidden">
        <div class="field">
          <label for="newPassword">New password</label>

          <div class="input-wrap">
            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Enter your new password"
              required
            >

            <button
              class="toggle-password"
              type="button"
              data-target="newPassword"
            >
              Show
            </button>
          </div>

          <p class="hint">Use at least 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>

          <div class="input-wrap">
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Enter your password again"
              required
            >

            <button
              class="toggle-password"
              type="button"
              data-target="confirmPassword"
            >
              Show
            </button>
          </div>
        </div>

        <button class="button" id="resetButton" type="submit">
          Update password
        </button>
      </form>

      <div id="successActions" class="hidden">
        <a href="login.html">Return to login</a>
      </div>
    </section>

    <footer class="footer">
      Having trouble?
      <a href="login.html">Return to login</a>
      <br>
      &copy; <span id="currentYear"></span> AlphaScript
    </footer>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://qaivqscssdtsnthdiqtu.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_TjT6PMScm58zNVJiug-kzQ_6oIaJNU9";

    const LOGIN_PATH = "login.html";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const statusMessage = document.getElementById("statusMessage");
    const pageDescription = document.getElementById("pageDescription");
    const successActions = document.getElementById("successActions");
    const themeButton = document.getElementById("themeButton");

    let recoveryReady = false;
    let passwordUpdated = false;

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    function showMessage(message, type = "info") {
      statusMessage.textContent = message;
      statusMessage.className = `message visible ${type}`;
    }

    function showResetForm() {
      resetForm.classList.remove("hidden");
      showMessage(
        "Your reset link is valid. Enter your new password below.",
        "success"
      );
    }

    function hideResetForm() {
      resetForm.classList.add("hidden");
    }

    function showPasswordUpdated() {
      passwordUpdated = true;
      recoveryReady = false;
      hideResetForm();

      pageDescription.textContent =
        "Your AlphaScript account password has been updated.";

      showMessage(
        "Your password has been changed successfully. You can now return to login and sign in with your new password.",
        "success"
      );

      successActions.classList.remove("hidden");
    }

    /*
      Supabase may deliver the recovery session through a URL fragment
      or, in some configurations, through PKCE query parameters.
      Let the Supabase client process the URL first.
    */
    async function initializeResetPage() {
      try {
        const url = new URL(window.location.href);
        const queryError = url.searchParams.get("error_description");
        const hashParams = new URLSearchParams(
          url.hash.replace(/^#/, "")
        );

        const hashError =
          hashParams.get("error_description") ||
          hashParams.get("error");

        if (queryError || hashError) {
          throw new Error(
            queryError ||
            hashError ||
            "The password-reset link is invalid or expired."
          );
        }

        const {
          data: { session },
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (session) {
          const isRecovery =
            hashParams.get("type") === "recovery" ||
            url.searchParams.get("type") === "recovery" ||
            session.user?.recovery_sent_at;

          /*
            A valid session can be used for the password update.
            The recovery event is also handled below for links where
            Supabase creates the session asynchronously.
          */
          if (isRecovery || session.user) {
            recoveryReady = true;
            showResetForm();
            return;
          }
        }

        showMessage(
          "Your reset session could not be verified. Please request a new password-reset email from the login page.",
          "error"
        );
      } catch (error) {
        console.error("Reset page initialization error:", error);

        showMessage(
          error.message ||
            "Unable to verify this reset link. Please request a new one.",
          "error"
        );
      }
    }

    /*
      Listen for the password-recovery event. This is important when
      Supabase processes the email link after the page has loaded.
    */
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        showResetForm();
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (passwordUpdated) {
        return;
      }

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        confirmPasswordInput.focus();
        return;
      }

      if (!recoveryReady) {
        showMessage(
          "Your reset session is not ready. Request a new reset link from the login page.",
          "error"
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating password...";
      showMessage("Updating your password...", "info");

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (error) {
          throw error;
        }

        if (!data?.user) {
          throw new Error(
            "Supabase did not confirm the password update. Please try again."
          );
        }

        /*
          The password has been updated. Sign out so the user can
          explicitly sign in with the new password.
        */
        const { error: signOutError } =
          await supabase.auth.signOut();

        if (signOutError) {
          console.warn(
            "Password updated, but sign-out failed:",
            signOutError.message
          );
        }

        showResetForm();
        showResetForm();

        passwordUpdated = true;
        recoveryReady = false;
        hideResetForm();

        pageDescription.textContent =
          "Your AlphaScript account password has been updated.";

        showMessage(
          "Password updated successfully! You can now sign in using your new password.",
          "success"
        );

        successActions.classList.remove("hidden");
      } catch (error) {
        console.error("Password update error:", error);

        showMessage(
          error.message ||
            "Could not update your password. Request a new reset link and try again.",
          "error"
        );
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Update password";
      }
    });

    document.querySelectorAll(".toggle-password").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);

        if (!input) return;

        const showPassword = input.type === "password";

        input.type = showPassword ? "text" : "password";
        button.textContent = showPassword ? "Hide" : "Show";
      });
    });

    // Restore the previously selected theme.
    const savedTheme = localStorage.getItem("alphascript-theme");

    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    themeButton.addEventListener("click", () => {
      const currentTheme =
        document.documentElement.getAttribute("data-theme") || "dark";

      const newTheme =
        currentTheme === "dark" ? "light" : "dark";

      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("alphascript-theme", newTheme);
    });

    initializeResetPage();
  </script>
</body>
</html>
