
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Reset Password | AlphaScript</title>
  <link rel="stylesheet" href="styles/style.css">

  <style>
    .reset-page {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      background: #0b1020;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      border: 1px solid #263453;
      border-radius: 18px;
      background: #111a2e;
      box-sizing: border-box;
    }

    .reset-brand {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .reset-brand span {
      color: #7c9dff;
    }

    .reset-card h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .reset-card p {
      color: #aab6cf;
      line-height: 1.7;
    }

    .reset-card label {
      display: block;
      margin: 20px 0 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    .reset-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #354361;
      border-radius: 8px;
      background: #0b1020;
      color: white;
      font-size: 16px;
    }

    .reset-card input:focus {
      outline: 2px solid #5278ff;
      outline-offset: 2px;
    }

    .reset-card button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #315efb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .reset-back {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #9db4ff;
      text-decoration: none;
    }

    .reset-back:hover {
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 26px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="reset-page">
    <section class="reset-card">
      <div class="reset-brand">
        Alpha<span>Script</span>
      </div>

      <h1>Reset your password.</h1>

      <p>
        Choose a new password for your AlphaScript account.
        Make sure it is secure and that both entries match.
      </p>

      <form id="resetForm" hidden>
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter your new password"
          required
        >

        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter it again"
          required
        >

        <label>
          <input
            id="showPasswords"
            type="checkbox"
            style="width:auto;margin-right:8px"
          >
          Show passwords
        </label>

        <button id="updateButton" type="submit">
          Update Password
        </button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Checking your password reset link...
      </p>

      <a class="reset-back" href="login.html">
        Back to login
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Use the same project URL and publishable/anon key as login.html.
    const SUPABASE_URL =
      "https://qaivqscssdtsnthdiqtu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhaXZxc2Nzc2R0c250aGRpcXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mjg3MjgsImV4cCI6MjEwNzMwNDcyOH0.i3cpwFKOCnfvGtAKsRpP3LxwIQl2l3-ZJq_9WTrRBP8";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const status = document.getElementById("status");
    const button = document.getElementById("updateButton");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword =
      document.getElementById("confirmPassword");
    const showPasswords =
      document.getElementById("showPasswords");

    let recoveryVerified = false;

    function showStatus(message) {
      status.textContent = message;
    }

    function enableRecoveryForm() {
      recoveryVerified = true;
      form.hidden = false;
      showStatus("Your recovery link is valid. Choose a new password.");
    }

    function rejectRecoveryLink() {
      recoveryVerified = false;
      form.hidden = true;
      showStatus(
        "This reset link is invalid or expired. Request a new password reset email."
      );
    }

    showPasswords.addEventListener("change", () => {
      const type = showPasswords.checked ? "text" : "password";
      newPassword.type = type;
      confirmPassword.type = type;
    });

    // Supabase emits PASSWORD_RECOVERY when a recovery link is accepted.
    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        enableRecoveryForm();
      }
    });

    async function checkRecoverySession() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        rejectRecoveryLink();
        return;
      }

      const fragment = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const isRecoveryLink =
        fragment.get("type") === "recovery";

      if (isRecoveryLink) {
        enableRecoveryForm();
      } else if (!recoveryVerified) {
        rejectRecoveryLink();
      }
    }

    checkRecoverySession();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) {
        rejectRecoveryLink();
        return;
      }

      if (newPassword.value.length < 8) {
        showStatus("Your new password must contain at least 8 characters.");
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        showStatus("The passwords do not match. Please try again.");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating password...";
      showStatus("Updating your password securely...");

      try {
        const { error } = await client.auth.updateUser({
          password: newPassword.value
        });

        if (error) {
          showStatus(error.message);
          return;
        }

        form.hidden = true;
        newPassword.value = "";
        confirmPassword.value = "";

        // End the recovery session after a successful update.
        await client.auth.signOut();

        showStatus(
          "Password updated successfully! You can now log in with your new password."
        );
      } catch (error) {
        showStatus("Something went wrong. Please try again.");
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
