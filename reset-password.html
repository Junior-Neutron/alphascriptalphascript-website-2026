
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071019">
  <title>Reset Password | AlphaScript</title>

  <style>
    :root {
      --bg: #071019;
      --panel: #0c1824;
      --text: #edf7ff;
      --muted: #9aafc4;
      --border: #294156;
      --green: #00e6ad;
      --field: #09131e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
    }

    .card {
      width: min(440px, 100%);
      padding: clamp(22px, 6vw, 36px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 55px #0003;
    }

    .brand {
      text-align: center;
      color: var(--green);
      font-size: 29px;
      font-weight: 850;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 27px;
    }

    .intro, #status {
      color: var(--muted);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .intro { text-align: center; }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
      font-weight: 650;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }

    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .show-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .show-row input { accent-color: var(--green); }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--green);
      border-radius: 10px;
      background: var(--green);
      color: #032019;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 18px;
      font-size: 14px;
    }

    #status.error { color: #ff9999; }
    #status.success { color: var(--green); }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--green);
      text-decoration: none;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">AlphaScript</div>
    <h1>Choose a new password</h1>

    <p class="intro">
      Use this page after opening your AlphaScript password-reset email.
    </p>

    <p id="status" role="status" aria-live="polite">
      Verifying your password-reset link...
    </p>

    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter it again"
        required
      >

      <label class="show-row">
        <input id="showPasswords" type="checkbox">
        Show passwords
      </label>

      <button id="updateButton" type="submit">
        Update password
      </button>
    </form>

    <a class="back" href="login.html">← Back to login</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://qaivqscssdtsnthdiqtu.supabase.co';

    // IMPORTANT:
    // Copy the exact publishable key from login.html.
    // Paste it between the quotes below with NO extra spaces.
    // It should begin with sb_publishable_ or be your project's
    // existing public anon key. Never use a service_role/secret key.
    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_TjT6PMScm58zNVJiugk-zQ_6oIaJNU9';

    const form = document.getElementById('resetForm');
    const statusBox = document.getElementById('status');
    const button = document.getElementById('updateButton');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const showPasswords = document.getElementById('showPasswords');

    let client;
    let recoveryVerified = false;
    let passwordUpdated = false;

    function showStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function enableForm() {
      if (passwordUpdated) return;

      recoveryVerified = true;
      form.hidden = false;
      showStatus('Your reset link is verified. Choose a new password.');
    }

    function rejectLink(message) {
      recoveryVerified = false;
      form.hidden = true;
      showStatus(
        message || 'This reset link is invalid or expired. Return to login and request a new reset email.',
        'error'
      );
    }

    function getErrorFromUrl() {
      const query = new URLSearchParams(window.location.search);
      const fragment = new URLSearchParams(window.location.hash.slice(1));

      return (
        query.get('error_description') ||
        fragment.get('error_description') ||
        query.get('error') ||
        fragment.get('error')
      );
    }

    showPasswords.addEventListener('change', () => {
      const type = showPasswords.checked ? 'text' : 'password';
      newPassword.type = type;
      confirmPassword.type = type;
    });

    async function start() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error(
            'The authentication library could not load. Check your internet connection and reload.'
          );
        }

        if (
          !SUPABASE_PUBLISHABLE_KEY ||
          SUPABASE_PUBLISHABLE_KEY ===
            '        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhaXZxc2Nzc2R0c250aGRpcXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mjg3MjgsImV4cCI6MjEwNzMwNDcyOH0.i3cpwFKOCnfvGtAKsRpP3LxwIQl2l3-ZJq_9WTrRBP8'
        ) {
          throw new Error(
            'Supabase is not configured. Add the same public key used by login.html.'
          );
        }

        const urlError = getErrorFromUrl();

        if (urlError) {
          rejectLink(decodeURIComponent(urlError.replace(/\+/g, ' ')));
          return;
        }

        client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

        // Supabase emits this event when it accepts a recovery link.
        client.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY' && session) {
            enableForm();
          }
        });

        // Allow the Supabase client time to process the URL/session.
        const { data, error } = await client.auth.getSession();

        if (error) {
          rejectLink(error.message);
          return;
        }

        const query = new URLSearchParams(window.location.search);
        const fragment = new URLSearchParams(
          window.location.hash.slice(1)
        );

        const hasRecoveryMarker =
          query.get('type') === 'recovery' ||
          fragment.get('type') === 'recovery';

        const hasRecoveryCode = query.has('code');

        if (data.session && (hasRecoveryMarker || hasRecoveryCode)) {
          enableForm();
          return;
        }

        if (!recoveryVerified) {
          rejectLink();
        }
      } catch (error) {
        rejectLink(error.message || 'Could not verify the reset link.');
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!recoveryVerified || !client) {
        rejectLink();
        return;
      }

      if (newPassword.value.length < 8) {
        showStatus('Your password must be at least 8 characters.', 'error');
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        showStatus('The passwords do not match. Try again.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating password...';
      showStatus('Updating your password securely...');

      try {
        const { error } = await client.auth.updateUser({
          password: newPassword.value
        });

        if (error) {
          showStatus(error.message, 'error');
          return;
        }

        passwordUpdated = true;
        recoveryVerified = false;
        form.hidden = true;
        newPassword.value = '';
        confirmPassword.value = '';

        showStatus(
          'Password updated successfully! Go back to login and sign in with your new password.',
          'success'
        );

        // End the recovery session after the password has been changed.
        await client.auth.signOut();
      } catch (error) {
        showStatus(
          error.message || 'Something went wrong. Please try again.',
          'error'
        );
      } finally {
        button.disabled = false;
        button.textContent = 'Update password';
      }
    });

    start();
  </script>
</body>
</html>
