<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <meta
    name="description"
    content="Reset your AlphaScript account password securely."
  >

  <title>Reset Password | AlphaScript</title>

  <style>
    :root {
      --bg: #070b14;
      --card: #101827;
      --input: #0b1220;
      --text: #f4f7ff;
      --muted: #9aa8bf;
      --border: #26354d;
      --primary: #7c5cff;
      --primary-hover: #6845f0;
      --success: #34d399;
      --danger: #fb7185;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top left,
          rgba(124, 92, 255, 0.17),
          transparent 38%
        ),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    body.light-theme {
      --bg: #f3f6fc;
      --card: #ffffff;
      --input: #f8faff;
      --text: #172033;
      --muted: #65718a;
      --border: #dce3ef;
      --shadow: 0 20px 60px rgba(25, 40, 70, 0.12);
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #7c5cff, #4b8dff);
      font-weight: 900;
    }

    .theme-button {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .lock-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 20px;
      border-radius: 18px;
      background: rgba(124, 92, 255, 0.15);
      font-size: 27px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 6vw, 31px);
      letter-spacing: -0.8px;
    }

    .description {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 13px 72px 13px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--input);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.14);
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .hint {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .primary-button {
      width: 100%;
      min-height: 49px;
      padding: 13px 16px;
      border: none;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .primary-button:hover {
      background: var(--primary-hover);
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      border-color: rgba(251, 113, 133, 0.4);
      background: rgba(251, 113, 133, 0.09);
      color: var(--danger);
    }

    .message.success {
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.09);
      color: var(--success);
    }

    .message.info {
      background: rgba(124, 92, 255, 0.08);
      color: var(--muted);
    }

    .footer {
      margin-top: 23px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 23px 19px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="top-bar">
      <a class="brand" href="login.html" aria-label="AlphaScript login">
        <span class="brand-icon">A</span>
        <span>AlphaScript</span>
      </a>

      <button
        type="button"
        class="theme-button"
        id="themeButton"
        aria-label="Change color theme"
      >
        ☀️ Light
      </button>
    </div>

    <section class="card">
      <div class="lock-icon" aria-hidden="true">🔐</div>

      <h1>Reset your password</h1>

      <p class="description" id="description">
        Enter your new password below to regain access to your AlphaScript
        account.
      </p>

      <div
        class="message"
        id="statusMessage"
        role="status"
        aria-live="polite"
      ></div>

      <form id="resetForm" class="hidden">
        <div class="field">
          <label for="newPassword">New password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter your new password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show-password"
              data-target="newPassword"
            >
              Show
            </button>
          </div>

          <small class="hint">
            Use at least 8 characters.
          </small>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter the password again"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show-password"
              data-target="confirmPassword"
            >
              Show
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="primary-button"
          id="saveButton"
        >
          Update Password
        </button>
      </form>

      <div class="footer">
        Remembered your password?
        <a href="login.html">Return to login</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // AlphaScript Supabase configuration.
    const SUPABASE_URL =
      "https://qaivqscssdtsnthdiqtu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TjT6PMScm58zNVJiug-kzQ_6oIaJNU9";

    const LOGIN_PATH = "login.html";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const resetForm = document.getElementById("resetForm");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");
    const saveButton = document.getElementById("saveButton");
    const statusMessage = document.getElementById("statusMessage");
    const description = document.getElementById("description");
    const themeButton = document.getElementById("themeButton");

    let recoveryReady = false;
    let recoveryFailed = false;
    let passwordUpdated = false;
    let initializationStarted = false;

    function showMessage(message, type = "info") {
      statusMessage.textContent = message;
      statusMessage.className = "message visible " + type;
    }

    function hideMessage() {
      statusMessage.textContent = "";
      statusMessage.className = "message";
    }

    function setTheme(theme) {
      const useLightTheme = theme === "light";

      document.body.classList.toggle("light-theme", useLightTheme);

      themeButton.textContent = useLightTheme
        ? "🌙 Dark"
        : "☀️ Light";

      localStorage.setItem("alphascript-theme", theme);
    }

    const savedTheme = localStorage.getItem("alphascript-theme");

    setTheme(savedTheme === "light" ? "light" : "dark");

    themeButton.addEventListener("click", function () {
      const isLight = document.body.classList.contains("light-theme");

      setTheme(isLight ? "dark" : "light");
    });

    // Show/hide each password field independently.
    document.querySelectorAll(".show-password").forEach(function (button) {
      button.addEventListener("click", function () {
        const input = document.getElementById(button.dataset.target);

        if (!input) return;

        const shouldShow = input.type === "password";

        input.type = shouldShow ? "text" : "password";
        button.textContent = shouldShow ? "Hide" : "Show";
      });
    });

    function showResetForm() {
      recoveryReady = true;
      recoveryFailed = false;

      resetForm.classList.remove("hidden");

      description.textContent =
        "Choose a new password for your AlphaScript account.";

      showMessage(
        "Your recovery session is ready. Enter and confirm your new password.",
        "info"
      );
    }

    function showRecoveryError(message) {
      recoveryReady = false;
      recoveryFailed = true;

      resetForm.classList.add("hidden");

      description.textContent =
        "We could not verify this password-reset link.";

      showMessage(
        message +
        " Return to login and request a new password-reset email.",
        "error"
      );
    }

    function hasRecoveryMarker() {
      const url = new URL(window.location.href);

      const queryType = url.searchParams.get("type");
      const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, "")
      );
      const hashType = hashParams.get("type");

      return (
        queryType === "recovery" ||
        hashType === "recovery" ||
        url.searchParams.has("code") ||
        hashParams.has("access_token")
      );
    }

    async function initializeResetPage() {
      if (initializationStarted) return;
      initializationStarted = true;

      if (!window.supabase) {
        showRecoveryError(
          "The authentication library could not be loaded."
        );
        return;
      }

      const recoveryMarker = hasRecoveryMarker();

      // Supabase normally processes the recovery callback automatically.
      // Listen for the recovery event and then verify the resulting session.
      const authSubscription =
        supabaseClient.auth.onAuthStateChange(function (event, session) {
          if (passwordUpdated) return;

          if (event === "PASSWORD_RECOVERY" && session) {
            showResetForm();
          }
        });

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          // A valid session can be used to update the account password.
          // This also supports the recovery link after Supabase processes it.
          showResetForm();
          return;
        }

        if (recoveryMarker) {
          // Give Supabase's URL callback processing a moment to finish.
          await new Promise(function (resolve) {
            setTimeout(resolve, 1000);
          });

          const { data: retryData, error: retryError } =
            await supabaseClient.auth.getSession();

          if (retryError) {
            throw retryError;
          }

          if (retryData.session) {
            showResetForm();
            return;
          }

          showRecoveryError(
            "This link may have expired, already been used, or failed verification."
          );
          return;
        }

        showRecoveryError(
          "Open this page using the password-reset link sent to your email."
        );
      } catch (error) {
        console.error("Password recovery initialization error:", error);

        showRecoveryError(
          error.message ||
          "An unexpected error occurred while checking your recovery link."
        );
      }
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (passwordUpdated) {
        window.location.href = LOGIN_PATH;
        return;
      }

      if (!recoveryReady || recoveryFailed) {
        showMessage(
          "Your recovery session is not ready. Request a new reset link if necessary.",
          "error"
        );
        return;
      }

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        newPasswordInput.focus();
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          "The passwords do not match. Please check them and try again.",
          "error"
        );
        confirmPasswordInput.focus();
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Updating password...";
      hideMessage();

      try {
        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error(
            "Supabase did not confirm the password update."
          );
        }

        passwordUpdated = true;
        recoveryReady = false;

        resetForm.classList.add("hidden");

        description.textContent =
          "Your AlphaScript account password has been updated successfully.";

        showMessage(
          "Password updated successfully. For security, you will now be signed out. Return to login and sign in with your new password.",
          "success"
        );

        // End the session after changing the password.
        const { error: signOutError } =
          await supabaseClient.auth.signOut();

        if (signOutError) {
          console.warn(
            "Password updated, but sign-out returned an error:",
            signOutError.message
          );
        }

        // Remove recovery tokens from the browser address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        const footerLink = document.querySelector(".footer a");

        if (footerLink) {
          footerLink.textContent = "Sign in with your new password";
        }
      } catch (error) {
        console.error("Password update error:", error);

        showMessage(
          error.message ||
          "We could not update your password. Please try again.",
          "error"
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Update Password";
      }
    });

    initializeResetPage();
  </script>
</body>
</html>
