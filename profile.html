
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>Developer Onboarding | AlphaScript</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1625;
      --card: #111d30;
      --border: #243650;
      --cyan: #53e7ff;
      --blue: #568cff;
      --violet: #a77bff;
      --text: #f0f5ff;
      --muted: #8e9db6;
      --success: #71f5bc;
      --danger: #ff8398;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 0%, #12284b 0, transparent 42%),
        radial-gradient(ellipse at 95% 80%, #251342 0, transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }

    a { color: var(--cyan); text-decoration: none; }

    .shell {
      width: min(760px, 100%);
      margin: auto;
      padding: 22px 16px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 34px;
    }

    .brand {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand span { color: var(--cyan); }

    .status {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .intro { margin-bottom: 26px; }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.1;
      letter-spacing: -1.8px;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      background-clip: text;
      -webkit-background-clip: text;
    }

    .muted {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 5vw, 34px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(145deg, #101a2aee, #0b111eee);
      box-shadow: 0 20px 70px #0005, inset 0 1px #ffffff08;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      margin-bottom: 30px;
      border-radius: 99px;
      background: #202c40;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
      box-shadow: 0 0 15px #53e7ff55;
      transition: width .3s ease;
    }

    .step-tag {
      margin-bottom: 12px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h2 {
      margin: 0;
      font-size: clamp(23px, 5vw, 32px);
      line-height: 1.25;
      letter-spacing: -.7px;
    }

    .question-help {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field {
      display: block;
      width: 100%;
      padding: 15px;
      border: 1px solid #30435e;
      border-radius: 12px;
      outline: none;
      background: #080f1c;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }

    .field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px #53e7ff14;
    }

    textarea.field {
      min-height: 125px;
      resize: vertical;
    }

    .field::placeholder { color: #65758f; }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 57px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0a1220;
      color: #d9e5fa;
      cursor: pointer;
      transition: .2s ease;
      font-size: 13px;
      line-height: 1.45;
    }

    .choice input {
      accent-color: var(--cyan);
      flex-shrink: 0;
    }

    .choice:has(input:checked) {
      border-color: var(--cyan);
      background: linear-gradient(120deg, #123047, #211d3b);
      box-shadow: inset 0 0 0 1px #53e7ff20, 0 0 18px #53e7ff0c;
      color: white;
    }

    .choice:focus-within {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .review {
      display: grid;
      gap: 10px;
    }

    .review-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #09111e;
      overflow-wrap: anywhere;
    }

    .review-label {
      margin-bottom: 6px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .review-value {
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .nav {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      min-height: 48px;
      padding: 13px 18px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #121e30;
      color: var(--text);
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s, opacity .2s, box-shadow .2s;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary {
      flex: 1;
      border-color: transparent;
      background: linear-gradient(100deg, #168fce, #5268f4 65%, #8554dc);
      box-shadow: 0 8px 25px #3f73ff24;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 8px 28px #3f73ff48;
    }

    #notice {
      margin: 18px 0 0;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.7;
    }

    .footer {
      padding-top: 24px;
      color: #687991;
      font-size: 11px;
      text-align: center;
      letter-spacing: 1px;
    }

    .hidden { display: none !important; }

    .step-content {
      animation: enter .24s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 430px) {
      .choices { grid-template-columns: 1fr; }
      .topbar { margin-bottom: 26px; }
      .status { font-size: 9px; letter-spacing: 1px; }
      .nav { gap: 8px; }
      .btn { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">ALPHA<span>SCRIPT</span></a>
      <div class="status">DEVELOPER SETUP</div>
    </header>

    <section class="intro">
      <div class="eyebrow">Your journey starts here</div>
      <h1>Define your <span>developer identity.</span></h1>
      <p class="muted">
        Tell us about yourself, your technical interests and what you
        want to build. One step at a time.
      </p>
    </section>

    <section class="panel">
      <div class="progress-row">
        <span id="stepCounter">INITIALIZING</span>
        <span id="progressPercent">0% COMPLETE</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Onboarding progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressTrack"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="wizard">
        <div id="stepTag" class="step-tag"></div>
        <h2 id="question"></h2>
        <p id="questionHelp" class="question-help"></p>
        <div id="answerArea"></div>

        <div class="nav">
          <button type="button" class="btn" id="backButton">← Back</button>
          <button type="button" class="btn btn-primary" id="nextButton">
            Next →
          </button>
        </div>
      </div>

      <p id="notice" role="status" aria-live="polite">
        Connecting to AlphaScript...
      </p>
    </section>

    <footer class="footer">
      BUILD WITH PURPOSE · LEARN WITHOUT LIMITS
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://qaivqscssdtsnthdiqtu.supabase.co";

    // Replace this placeholder with your EXISTING public publishable key.
    // Never put a service_role or secret key in browser code.
    const SUPABASE_PUBLISHABLE_KEY =
       '
sb_publishable_TjT6PMScm58zNVJiugk-zQ_6oIaJNU9';

    const roleOptions = [
      "Python Developer", "Frontend Developer", "Backend Developer",
      "Full-Stack Developer", "Web Developer", "Mobile Developer",
      "Game Developer", "AI / Machine Learning Developer",
      "Data Scientist", "Cybersecurity", "Systems Programmer",
      "Software Engineer", "Embedded Developer", "DevOps Engineer",
      "Database Developer", "Other / Exploring"
    ];

    const languageOptions = [
      "Python", "JavaScript", "TypeScript", "HTML", "CSS",
      "Java", "C", "C++", "C#", "PHP", "Go", "Rust", "Kotlin",
      "Swift", "SQL", "Lua", "Dart", "R", "Ruby", "Bash",
      "Assembly", "Other"
    ];

    const occupationOptions = [
      "Student", "Employed developer", "Self-employed / Freelancer",
      "Business owner / Founder", "Teacher / Instructor",
      "Researcher", "Seeking opportunities", "Hobbyist", "Other"
    ];

    const experienceOptions = [
      "Complete beginner", "Basic knowledge", "Intermediate",
      "Advanced", "Professional experience"
    ];

    const steps = [
      {
        key: "username",
        title: "What should we call you?",
        help: "Choose your unique AlphaScript username. Use 3–24 letters, numbers or underscores.",
        type: "text",
        placeholder: "e.g. Junior_Neutron",
        max: 24
      },
      {
        key: "display_name",
        title: "What's your display name?",
        help: "This is the name other developers can see. You can leave it blank.",
        type: "text",
        placeholder: "Your preferred display name",
        max: 60
      },
      {
        key: "bio",
        title: "What's your story?",
        help: "Write a short introduction about your interests and what you enjoy building. Optional.",
        type: "textarea",
        placeholder: "I'm interested in programming, AI and building useful projects...",
        max: 300
      },
      {
        key: "country",
        title: "Where are you based?",
        help: "Add your country or region if you'd like. This is optional.",
        type: "text",
        placeholder: "e.g. Ghana",
        max: 80
      },
      {
        key: "developer_roles",
        title: "What kind of developer are you?",
        help: "Choose all the roles that interest you. It's okay to be exploring.",
        type: "checks",
        options: roleOptions
      },
      {
        key: "programming_languages",
        title: "Which technologies interest you?",
        help: "Select languages and technologies you use or want to learn.",
        type: "checks",
        options: languageOptions
      },
      {
        key: "occupation",
        title: "What best describes you?",
        help: "Choose your current situation.",
        type: "radio",
        options: occupationOptions
      },
      {
        key: "experience_level",
        title: "Where are you on your journey?",
        help: "Choose the option that best describes your current experience. This isn't a test.",
        type: "radio",
        options: experienceOptions
      },
      {
        key: "skills",
        title: "What can you do today?",
        help: "Describe concepts you understand, skills you're practising or projects you've made. Optional.",
        type: "textarea",
        placeholder: "Variables, loops, HTML pages, small Python projects...",
        max: 1500
      },
      {
        key: "learning_goals",
        title: "What do you want to achieve?",
        help: "Tell us what you want to learn or build. Your answers can help shape future AlphaScript features.",
        type: "textarea",
        placeholder: "Build websites, develop games, learn AI, collaborate...",
        max: 1000
      },
      {
        key: "review",
        title: "Ready to define your profile?",
        help: "Review your answers before saving them to your AlphaScript account.",
        type: "review"
      }
    ];

    const defaults = {
      username: "",
      display_name: "",
      bio: "",
      country: "",
      developer_roles: [],
      programming_languages: [],
      occupation: "",
      experience_level: "",
      skills: "",
      learning_goals: ""
    };

    let answers = { ...defaults };
    let currentStep = 0;
    let client = null;
    let currentUser = null;
    let isSaving = false;

    const $ = id => document.getElementById(id);

    const wizard = $("wizard");
    const notice = $("notice");
    const answerArea = $("answerArea");
    const backButton = $("backButton");
    const nextButton = $("nextButton");

    function showNotice(message, type = "info") {
      notice.textContent = message;
      notice.style.color =
        type === "error" ? "var(--danger)" :
        type === "success" ? "var(--success)" :
        "var(--muted)";
    }

    function createField(step) {
      const field = document.createElement(
        step.type === "textarea" ? "textarea" : "input"
      );

      field.className = "field";
      field.id = "currentAnswer";
      field.name = step.key;

      if (step.type === "text") {
        field.type = "text";
        field.maxLength = step.max;
        field.autocomplete =
          step.key === "username" ? "nickname" : "off";
      }

      if (step.type === "textarea") {
        field.maxLength = step.max;
      }

      field.placeholder = step.placeholder || "";
      field.value = answers[step.key] || "";

      field.addEventListener("input", () => {
        answers[step.key] = field.value;
      });

      return field;
    }

    function renderChoices(step) {
      const container = document.createElement("div");
      container.className = "choices";

      const selected = Array.isArray(answers[step.key])
        ? answers[step.key]
        : [];

      step.options.forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "choice";

        const input = document.createElement("input");
        input.type = step.type === "checks" ? "checkbox" : "radio";
        input.name = step.key;
        input.value = option;
        input.checked = selected.includes(option);
        input.id = "choice-" + index;

        input.addEventListener("change", () => {
          if (step.type === "checks") {
            const checked = Array.from(
              container.querySelectorAll('input[type="checkbox"]:checked')
            ).map(item => item.value);

            answers[step.key] = checked;
          } else {
            answers[step.key] = input.value;
          }
        });

        const text = document.createElement("span");
        text.textContent = option;

        label.append(input, text);
        container.appendChild(label);
      });

      return container;
    }

    function renderReview() {
      const container = document.createElement("div");
      container.className = "review";

      const fields = [
        ["Username", "username"],
        ["Display name", "display_name"],
        ["Bio", "bio"],
        ["Country / region", "country"],
        ["Developer roles", "developer_roles"],
        ["Languages / technologies", "programming_languages"],
        ["Occupation", "occupation"],
        ["Experience level", "experience_level"],
        ["Current skills", "skills"],
        ["Learning goals", "learning_goals"]
      ];

      fields.forEach(([label, key]) => {
        const item = document.createElement("div");
        item.className = "review-item";

        const heading = document.createElement("div");
        heading.className = "review-label";
        heading.textContent = label;

        const value = document.createElement("div");
        value.className = "review-value";

        const raw = answers[key];
        value.textContent = Array.isArray(raw)
          ? raw.join(", ") || "Not specified"
          : String(raw || "").trim() || "Not specified";

        item.append(heading, value);
        container.appendChild(item);
      });

      return container;
    }

    function renderStep() {
      const step = steps[currentStep];
      const percent = Math.round(
        ((currentStep + 1) / steps.length) * 100
      );

      $("stepCounter").textContent =
        "STEP " + String(currentStep + 1).padStart(2, "0") +
        " / " + String(steps.length).padStart(2, "0");

      $("progressPercent").textContent = percent + "% COMPLETE";
      $("progressFill").style.width = percent + "%";
      $("progressTrack").setAttribute("aria-valuenow", String(percent));

      $("stepTag").textContent =
        "ALPHASCRIPT // " +
        String(currentStep + 1).padStart(2, "0");

      $("question").textContent = step.title;
      $("questionHelp").textContent = step.help;

      answerArea.replaceChildren();
      answerArea.className = "step-content";

      if (step.type === "text" || step.type === "textarea") {
        answerArea.appendChild(createField(step));
      } else if (step.type === "checks" || step.type === "radio") {
        answerArea.appendChild(renderChoices(step));
      } else if (step.type === "review") {
        answerArea.appendChild(renderReview());
      }

      backButton.disabled = currentStep === 0 || isSaving;
      nextButton.disabled = isSaving;
      nextButton.textContent =
        currentStep === steps.length - 1 ? "Save profile ✓" : "Next →";

      showNotice("");
    }

    function validateCurrentStep() {
      const step = steps[currentStep];

      if (step.key === "username") {
        const username = String(answers.username || "").trim();

        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
          showNotice(
            "Enter a username with 3–24 letters, numbers or underscores.",
            "error"
          );
          return false;
        }

        answers.username = username;
      }

      if (step.type === "text" || step.type === "textarea") {
        const field = $("currentAnswer");

        if (field && !field.checkValidity()) {
          field.reportValidity();
          return false;
        }

        if (field) answers[step.key] = field.value;
      }

      return true;
    }

    async function saveProfile() {
      if (isSaving) return;

      if (!client || !currentUser) {
        showNotice("Please log in before saving your profile.", "error");
        return;
      }

      if (!/^[A-Za-z0-9_]{3,24}$/.test(answers.username.trim())) {
        currentStep = 0;
        renderStep();
                showNotice("Please enter a valid username first.", "error");
        return;
      }

      isSaving = true;
      nextButton.disabled = true;
      backButton.disabled = true;
      nextButton.textContent = "Saving...";
      showNotice("Saving your developer profile...");

      try {
        const profile = {
          id: currentUser.id,
          username: answers.username.trim(),
          display_name: answers.display_name.trim() || null,
          bio: answers.bio.trim(),
          country: answers.country.trim() || null,
          developer_roles: answers.developer_roles,
          programming_languages: answers.programming_languages,
          occupation: answers.occupation || null,
          experience_level: answers.experience_level || null,
          skills: answers.skills
            .split(",").map(s => s.trim()).filter(Boolean),
          learning_goals: answers.learning_goals
            .split(",").map(s => s.trim()).filter(Boolean),
          updated_at: new Date().toISOString()
        };

        const { error } = await client
          .from("profiles")
          .upsert(profile, { onConflict: "id" });

        if (error) {
          if (error.code === "23505") {
            currentStep = 0;
            renderStep();
            showNotice(
              "That username is already taken. Choose another.",
              "error"
            );
          } else {
            showNotice(
              "Could not save profile: " + error.message,
              "error"
            );
          }
          return;
        }

        showNotice(
          "Profile saved successfully! Welcome to AlphaScript.",
          "success"
        );

        nextButton.textContent = "Profile saved ✓";
        nextButton.disabled = true;

      } catch (error) {
        showNotice(
          error.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        isSaving = false;
        backButton.disabled = currentStep === 0;

        if (!nextButton.disabled) {
          nextButton.textContent =
            currentStep === steps.length - 1
              ? "Save profile ✓"
              : "Next →";
        }
      }
    }

    backButton.addEventListener("click", () => {
      if (currentStep > 0 && !isSaving) {
        currentStep--;
        renderStep();
      }
    });

    nextButton.addEventListener("click", async () => {
      if (isSaving || !validateCurrentStep()) return;

      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep();
        return;
      }

      await saveProfile();
    });

    async function start() {
      if (
        !window.supabase ||
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY ===
                 'sb_publishable_TjT6PMScm58zNVJiugk-zQ_6oIaJNU9';
      ) {
        wizard.classList.add("hidden");
        showNotice(
          "Setup required: add your existing Supabase public publishable key in profile.html.",
          "error"
        );
        return;
      }

      try {
        client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await client.auth.getUser();

        if (error || !data.user) {
          wizard.classList.add("hidden");
          showNotice(
            "You're not logged in. Please log in first, then return to your profile.",
            "error"
          );

          const link = document.createElement("a");
          link.href = "login.html?screen=login";
          link.textContent = "Go to login →";
          link.style.display = "inline-block";
          link.style.marginTop = "12px";

          notice.appendChild(document.createElement("br"));
          notice.appendChild(link);
          return;
        }

        currentUser = data.user;

        const { data: profile, error: profileError } =
          await client
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();

        if (profileError) {
          showNotice(
            "Could not load your saved profile: " +
              profileError.message,
            "error"
          );
        } else if (profile) {
          answers = {
            username: profile.username || "",
            display_name: profile.display_name || "",
            bio: profile.bio || "",
            country: profile.country || "",
            developer_roles: profile.developer_roles || [],
            programming_languages:
              profile.programming_languages || [],
            occupation: profile.occupation || "",
            experience_level: profile.experience_level || "",
            skills: Array.isArray(profile.skills)
              ? profile.skills.join(", ")
              : "",
            learning_goals:
              Array.isArray(profile.learning_goals)
                ? profile.learning_goals.join(", ")
                : ""
          };
        }

        renderStep();

        if (profile) {
          showNotice(
            "Welcome back. Your saved answers have been loaded."
          );
        } else {
          showNotice("Let's set up your developer profile.");
        }

      } catch (error) {
        wizard.classList.add("hidden");
        showNotice(
          error.message ||
            "Could not connect. Check your internet and Supabase configuration.",
          "error"
        );
      }
    }

    renderStep();
    start();
  </script>
</body>
</html>
