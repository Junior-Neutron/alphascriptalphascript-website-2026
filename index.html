<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlphaScript | Code Beyond Limits</title>
<meta name="theme-color" content="#030605">

<style>
:root {
    --bg: #030605;
    --green: #00FF77;
    --text: #F1FFF5;
    --muted: #8BA997;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(#00FF7710 1px, transparent 1px),
        linear-gradient(90deg, #00FF7710 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 12s linear infinite;
    pointer-events: none;
}

@keyframes gridMove {
    to {
        background-position: 40px 40px;
    }
}

.intro {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: var(--bg);
    transition: opacity 0.4s ease;
}

.intro.leaving {
    opacity: 0;
}

.logo-container {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: var(--green);
    border-bottom-color: var(--green);
    border-radius: 50%;
    filter: drop-shadow(0 0 8px var(--green));
    animation: rotate 4s linear infinite;
}

.ring.two {
    inset: 13px;
    border-top-color: transparent;
    border-left-color: var(--green);
    border-right-color: var(--green);
    animation: rotateBack 3s linear infinite;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateBack {
    to {
        transform: rotate(-360deg);
    }
}

.logo {
    position: relative;
    z-index: 3;
    color: var(--green);
    font-size: 100px;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 12px var(--green),
                 0 0 30px #00FF7780;
    animation: appear 1.2s ease both;
}

@keyframes appear {
    from {
        transform: scale(0.5);
        opacity: 0.3;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.brand {
    font-size: clamp(27px, 7vw, 43px);
    font-weight: 900;
    letter-spacing: 5px;
    animation: rise 1s ease 0.3s both;
}

.brand span {
    color: var(--green);
}

.tagline {
    margin-top: 14px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    line-height: 1.8;
    animation: rise 1s ease 0.6s both;
}

.loading-area {
    width: 220px;
    margin-top: 40px;
}

.loading-text {
    margin-bottom: 12px;
    color: var(--green);
    font-size: 10px;
    letter-spacing: 2px;
}

.loading-track {
    width: 100%;
    height: 3px;
    background: #123321;
    overflow: hidden;
}

.loading-bar {
    width: 0;
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: load 5s linear forwards;
}

@keyframes load {
    to {
        width: 100%;
    }
}

@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 400px) {
    .logo-container {
        width: 145px;
        height: 145px;
    }

    .logo {
        font-size: 85px;
    }

    .tagline {
        font-size: 9px;
        letter-spacing: 1.5px;
    }
}
</style>
</head>

<body>

<div class="grid" aria-hidden="true"></div>

<main class="intro" id="intro">

    <div class="logo-container">
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="logo" aria-label="AlphaScript logo">A</div>
    </div>

    <h1 class="brand">
        ALPHA<span>SCRIPT</span>
    </h1>

    <p class="tagline">
        YOUR CODE. YOUR COMMUNITY. YOUR EVOLUTION.
    </p>

    <div class="loading-area">
        <p class="loading-text">
            INITIALIZING ALPHASCRIPT...
        </p>

        <div class="loading-track">
            <div class="loading-bar"></div>
        </div>
    </div>

</main>

<script>
(function () {
    "use strict";

    let redirectStarted = false;

    function openSignup() {
        if (redirectStarted) return;

        redirectStarted = true;

        document.getElementById("intro")
            .classList.add("leaving");

        // Resolve login.html relative to this page.
        const loginURL = new URL("login.html", window.location.href);
        loginURL.searchParams.set("screen", "signup");

        // Navigate to the separate login/signup file.
        window.location.replace(loginURL.href);
    }

    // Start redirect after five seconds.
    window.setTimeout(openSignup, 5000);

})();
</script>

</body>
</html>
