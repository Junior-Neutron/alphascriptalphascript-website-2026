<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">

  <title>AlphaScript | Build With Purpose</title>

  <style>
    :root {
      --bg: #070b14;
      --cyan: #53e7ff;
      --violet: #a77bff;
      --text: #f0f5ff;
      --muted: #8e9db6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 40%,
          #112748 0,
          transparent 42%
        ),
        radial-gradient(
          circle at 80% 80%,
          #251342 0,
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      isolation: isolate;
    }

    /* Background light */

    .orb {
      position: absolute;
      z-index: -1;
      width: min(75vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #168fce30 0,
        #a77bff12 40%,
        transparent 72%
      );
      filter: blur(8px);
      animation: orbMotion 4s ease-in-out infinite alternate;
    }

    .ring {
      position: absolute;
      z-index: -1;
      width: min(82vw, 390px);
      aspect-ratio: 1;
      border: 1px solid #53e7ff12;
      border-radius: 50%;
      animation: ringMotion 12s linear infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid #a77bff16;
      border-radius: 50%;
    }

    /* Main content */

    .content {
      width: 100%;
      max-width: 600px;
      text-align: center;
      animation: entrance 1.1s cubic-bezier(.2,.8,.2,1) both;
    }

    .symbol {
      position: relative;
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      margin: 0 auto 30px;
      border: 1px solid #53e7ff50;
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        #12263c,
        #0c1120
      );
      box-shadow:
        0 0 25px #53e7ff12,
        0 0 70px #a77bff12,
        inset 0 0 25px #53e7ff08;
      animation: symbolMotion 3s ease-in-out infinite;
    }

    .symbol span {
      font-size: 43px;
      font-weight: 950;
      letter-spacing: -5px;
      background: linear-gradient(
        135deg,
        var(--cyan),
        #ffffff,
        var(--violet)
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .logo {
      font-size: clamp(29px, 8vw, 58px);
      font-weight: 950;
      letter-spacing: clamp(2px, 1vw, 6px);
      white-space: nowrap;
      opacity: 0;
      animation: logoAppear 1s .25s ease forwards;
    }

    .logo .alpha {
      color: var(--text);
    }

    .logo .script {
      color: var(--cyan);
      text-shadow: 0 0 25px #53e7ff30;
    }

    .line {
      width: 0;
      height: 2px;
      margin: 23px auto;
      background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        var(--violet),
        transparent
      );
      animation: lineGrow 1s .7s ease forwards;
    }

    .tagline {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 5px;
      opacity: 0;
      animation: fadeIn .8s 1s ease forwards;
    }

    .description {
      max-width: 390px;
      margin: 22px auto 0;
      color: #a6b4cb;
      font-size: 14px;
      line-height: 1.9;
      opacity: 0;
      animation: fadeIn .8s 1.2s ease forwards;
    }

    /* Loading animation */

    .loader {
      width: 130px;
      height: 3px;
      margin: 33px auto 0;
      overflow: hidden;
      border-radius: 20px;
      background: #1b2a40;
      opacity: 0;
      animation: fadeIn .5s 1.3s ease forwards;
    }

    .loader span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--violet)
      );
      animation: loading 1.2s ease-in-out infinite alternate;
    }

    .loading-text {
      margin-top: 13px;
      color: #65758f;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn .5s 1.4s ease forwards;
    }

    /* Navigation */

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      opacity: 0;
      animation: fadeIn .7s 1.5s ease forwards;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 22px;
      border: 1px solid #30435e;
      border-radius: 12px;
      color: var(--text);
      background: #101a2a;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      box-shadow: 0 8px 25px #53e7ff15;
    }

    .button-primary {
      border-color: transparent;
      color: #07101c;
      background: linear-gradient(
        100deg,
        var(--cyan),
        #8c9bff
      );
    }

    .button-primary:hover {
      box-shadow: 0 8px 30px #53e7ff30;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      left: 12px;
      right: 12px;
      color: #586881;
      text-align: center;
      font-size: 9px;
      letter-spacing: 2px;
    }

    /* Motion */

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
        letter-spacing: 12px;
      }

      to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: clamp(2px, 1vw, 6px);
      }
    }

    @keyframes symbolMotion {
      0%, 100% {
        transform: translateY(0) rotate(0);
        box-shadow:
          0 0 25px #53e7ff12,
          0 0 70px #a77bff12;
      }

      50% {
        transform: translateY(-9px) rotate(3deg);
        box-shadow:
          0 0 35px #53e7ff30,
          0 0 85px #a77bff20;
      }
    }

    @keyframes orbMotion {
      from {
        transform: scale(.8);
        opacity: .5;
      }

      to {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    @keyframes ringMotion {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes lineGrow {
      to {
        width: min(240px, 65vw);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes loading {
      from {
        transform: translateX(-10%);
      }

      to {
        transform: translateX(165%);
      }
    }

    /* Small screens */

    @media (max-width: 380px) {
      .symbol {
        width: 78px;
        height: 78px;
        border-radius: 23px;
      }

      .symbol span {
        font-size: 36px;
      }

      .tagline {
        letter-spacing: 3px;
      }

      .description {
        font-size: 13px;
      }

      .button {
        padding: 12px 16px;
      }
    }

    /* Respect reduced-motion preferences */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="stage">

    <div class="orb" aria-hidden="true"></div>
    <div class="ring" aria-hidden="true"></div>

    <section class="content" aria-label="AlphaScript introduction">

      <div class="symbol" aria-hidden="true">
        <span>A<span style="color:#a77bff">S</span></span>
      </div>

      <h1 class="logo">
        <span class="alpha">ALPHA</span><span class="script">SCRIPT</span>
      </h1>

      <div class="line" aria-hidden="true"></div>

      <p class="tagline">BUILD WITH PURPOSE</p>

      <p class="description">
        A space for developers to learn, create, share projects,
        and build their future one line of code at a time.
      </p>

      <div class="loader" aria-hidden="true">
        <span></span>
      </div>

      <p class="loading-text" id="loadingText">
        PREPARING YOUR EXPERIENCE
      </p>

      <nav class="actions" aria-label="Continue to AlphaScript">

        <a
          class="button button-primary"
          href="login.html"
          id="enterButton">
          Continue to AlphaScript →
        </a>

        <a
          class="button"
          href="login.html">
          Skip to Login
        </a>

      </nav>

    </section>

    <footer class="footer">
      ALPHASCRIPT · LEARN WITHOUT LIMITS
    </footer>

  </main>

  <script>
    "use strict";

    /*
      Visitors see the animated introduction for approximately
      4 seconds before being sent to login.html.

      Both buttons allow visitors to continue immediately.
    */

    const LOGIN_PAGE = new URL(
      "login.html",
      window.location.href
    ).href;

    const INTRO_DURATION = 4000;

    let hasNavigated = false;

    function continueToLogin() {
      if (hasNavigated) return;

      hasNavigated = true;
      window.location.href = LOGIN_PAGE;
    }

    document
      .getElementById("enterButton")
      .addEventListener("click", event => {
        event.preventDefault();
        continueToLogin();
      });

    window.setTimeout(() => {
      if (hasNavigated) return;

      document.getElementById("loadingText").textContent =
        "WELCOME TO ALPHASCRIPT";

      continueToLogin();
    }, INTRO_DURATION);
  </script>

</body>
</html>
