<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--panel2:#172337;--line:#26364e;--text:#edf5ff;--muted:#9aacc5;--accent:#53e7ff;--blue:#568cff;--violet:#a77bff;--good:#43dba1;--danger:#ff6b81;--shadow:0 18px 55px #0004}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent)}.app{min-height:100dvh}.top{height:68px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.5px;font-size:19px;white-space:nowrap}.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blue),var(--violet));color:#06101d;font-weight:950}.topright{margin-left:auto;display:flex;gap:8px}.btn,.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 13px}.btn.primary{background:linear-gradient(120deg,#568cff,#7c5cff);border:0;color:white;font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.iconbtn{width:42px;height:42px;padding:0;font-size:18px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1500px;margin:auto}.sidebar{position:sticky;top:68px;height:calc(100dvh - 68px);padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.navbtn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:12px}.navbtn.active,.navbtn:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}.main{min-width:0;padding:24px;max-width:1200px;width:100%;margin:auto}.screen{display:none}.screen.active{display:block}.eyebrow{color:var(--accent);font-weight:750;text-transform:uppercase;font-size:11px;letter-spacing:1.6px}.hero{padding:clamp(22px,5vw,52px);border:1px solid var(--line);border-radius:26px;background:radial-gradient(ellipse at 90% 0%,#5b68ff25,transparent 45%),linear-gradient(135deg,var(--panel),var(--bg));box-shadow:var(--shadow)}h1{font-size:clamp(30px,5vw,54px);line-height:1.06;letter-spacing:-1.8px;margin:12px 0}h2{letter-spacing:-.5px;margin:0 0 12px}h3{margin:0 0 8px}.muted,small{color:var(--muted)}.hero p{max-width:650px;color:var(--muted);font-size:16px}.actions,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.actions{margin-top:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:17px;min-width:0}.card .glyph{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel2);color:var(--accent);font-weight:850;margin-bottom:12px}.stat{font-size:25px;font-weight:850}.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:12px;outline:none}.field:focus{border-color:var(--accent)}textarea.field{resize:vertical;min-height:140px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.search{max-width:420px}.list{display:grid;gap:10px;margin-top:14px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);padding:13px;border-radius:14px;min-width:0}.itemmain{flex:1;min-width:0}.itemmain strong,.itemmain small{display:block;overflow-wrap:anywhere}.avatar{width:42px;height:42px;border-radius:14px;background:var(--panel2);display:grid;pla body.solar{--bg:#100d04;--panel:#1b1708;--panel2:#29210a;--line:#51421b;--text:#fff4c2;--muted:#c7b77d;--accent:#ffe45c;--blue:#ffb72f;--violet:#ff7b3d}body.light{color-scheme:light;--bg:#f2f6fc;--panel:#fff;--panel2:#eaf0f8;--line:#d2dceb;--text:#152137;--muted:#53657e;--accent:#147eac;--blue:#416ee8;--violet:#8656d8}body.light .editor-area{background:#f7faff;color:#17243a}
@media(max-width:800px){.layout{display:block}.sidebar{display:none}.main{padding:16px 14px 90px}.top{padding:0 12px;height:60px}.brand{font-size:17px}.topright .wide{display:none}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.bottomnav .navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:5px 4px;min-width:0}.bottomnav .navbtn span:first-child{font-size:18px}.hero{border-radius:20px}.item{flex-wrap:wrap}.itemmain{min-width:130px}.plus{bottom:80px}}
